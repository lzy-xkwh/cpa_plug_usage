name: Release plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install ARM64 cross compiler
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build archive
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ext="so"
          cc=""
          if [ "$GOARCH" = "arm64" ]; then
            cc="aarch64-linux-gnu-gcc"
          fi
          if [ -n "$cc" ]; then
            CC="$cc" CGO_ENABLED=1 GOOS=linux GOARCH="$GOARCH" \
              go build -trimpath -buildmode=c-shared -o api-balance.so .
          else
            CGO_ENABLED=1 GOOS=linux GOARCH="$GOARCH" \
              go build -trimpath -buildmode=c-shared -o api-balance.so .
          fi
          rm -f api-balance.h
          archive="api-balance_${version}_linux_${GOARCH}.zip"
          zip "$archive" api-balance.so
          sha256sum "$archive" > "sha256-${GOARCH}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goarch }}
          path: |
            api-balance_*.zip
            sha256-*.txt

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create checksums file
        working-directory: dist
        run: |
          set -euo pipefail
          cat sha256-*.txt | awk '{print $1 "  " $2}' > checksums.txt
          rm -f sha256-*.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*

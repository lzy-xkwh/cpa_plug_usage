name: Release plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install ARM64 cross compiler
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build archive
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cc=""
          if [ "$GOARCH" = "arm64" ]; then
            cc="aarch64-linux-gnu-gcc"
          fi
          CC="$cc" CGO_ENABLED=1 GOOS=linux GOARCH="$GOARCH" \
            go build -mod=vendor -trimpath -buildmode=c-shared -o api-balance.so .
          rm -f api-balance.h
          archive="api-balance_${version}_linux_${GOARCH}.zip"
          zip "$archive" api-balance.so
          sha256sum "$archive" > "sha256-${GOARCH}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goarch }}
          path: |
            api-balance_*.zip
            sha256-*.txt

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create checksums file
        working-directory: dist
        run: |
          set -euo pipefail
          cat sha256-*.txt | awk '{print $1 "  " $2}' > checksums.txt
          rm -f sha256-*.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*

  registry:
    name: Update plugin registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'api-balance_*_linux_*.zip' \
            --dir dist

      - name: Update registry checksums
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          amd64="dist/api-balance_${version}_linux_amd64.zip"
          arm64="dist/api-balance_${version}_linux_arm64.zip"
          test -f "$amd64"
          test -f "$arm64"
          amd64_sha="$(sha256sum "$amd64" | awk '{print $1}')"
          arm64_sha="$(sha256sum "$arm64" | awk '{print $1}')"
          jq \
            --arg version "$version" \
            --arg repo "$REPOSITORY" \
            --arg amd64_sha "$amd64_sha" \
            --arg arm64_sha "$arm64_sha" \
            '(.plugins[] | select(.id == "api-balance")) |= (
               .version = $version |
               .install.artifacts |= map(
                 if .goos == "linux" and .goarch == "amd64" then
                   .url = ("https://github.com/" + $repo + "/releases/download/v" + $version + "/api-balance_" + $version + "_linux_amd64.zip") |
                   .sha256 = $amd64_sha
                 elif .goos == "linux" and .goarch == "arm64" then
                   .url = ("https://github.com/" + $repo + "/releases/download/v" + $version + "/api-balance_" + $version + "_linux_arm64.zip") |
                   .sha256 = $arm64_sha
                 else . end
               )
             )' registry.json > registry.json.tmp
          mv registry.json.tmp registry.json
          jq empty registry.json

      - name: Commit registry update
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- registry.json; then
            echo "registry.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "chore: publish ${VERSION} registry metadata"
          git push origin HEAD:main
